<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test de nivel</title>
<style>
  :root {
    --ink: #1f2937; --muted: #6b7280; --line: #e5e7eb; --bg: #f8fafc;
    --card: #ffffff; --brand: #dc2626; --pick: #eff6ff; --pick-line: #3b82f6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header { background: var(--ink); color: #fff; padding: 18px 16px; text-align: center; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; color: #cbd5e1; font-size: 13px; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; margin: 14px 0;
  }
  .hidden { display: none !important; }
  h2 { margin: 0 0 8px; font-size: 18px; }
  ul.notes { margin: 8px 0 0; padding-left: 20px; color: var(--muted); font-size: 15px; }
  label.field { display: block; margin: 12px 0; font-weight: 600; }
  label.field input {
    display: block; width: 100%; margin-top: 6px; padding: 12px;
    border: 1px solid var(--line); border-radius: 10px; font-size: 17px; font-weight: 400;
  }
  button {
    background: var(--brand); color: #fff; border: 0; border-radius: 12px;
    padding: 14px 20px; font-size: 17px; font-weight: 700; cursor: pointer; width: 100%;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost {
    background: #fff; color: var(--muted); border: 1px solid var(--line); font-weight: 600;
    margin-top: 10px;
  }
  .err { color: var(--brand); font-weight: 600; margin: 10px 0 0; min-height: 1.4em; }

  .progress { display: flex; align-items: center; gap: 12px; margin: 4px 0 12px; }
  .progress .bar { flex: 1; height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .progress .bar > div { height: 100%; background: var(--pick-line); width: 0; transition: width .25s; }
  .progress .txt { color: var(--muted); font-size: 14px; white-space: nowrap; }

  .qnum {
    display: inline-block; min-width: 34px; height: 34px; line-height: 34px; text-align: center;
    background: var(--ink); color: #fff; border-radius: 10px; font-weight: 700; margin-right: 10px;
  }
  .prompt { font-weight: 600; white-space: pre-line; font-size: 19px; margin: 12px 0 16px; }
  .opts { display: grid; gap: 10px; }
  .opt {
    display: flex; align-items: center; gap: 12px; padding: 14px; border: 2px solid var(--line);
    border-radius: 12px; cursor: pointer; background: #fff; font-size: 17px; text-align: left;
    color: var(--ink); font-weight: 500; width: 100%;
  }
  .opt:hover { border-color: var(--pick-line); }
  .opt.chosen { background: var(--pick); border-color: var(--pick-line); }
  .opt .key {
    flex: 0 0 auto; width: 28px; height: 28px; border-radius: 8px; background: var(--ink); color: #fff;
    display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
  }
  .opt.chosen .key { background: var(--pick-line); }
  .actions { margin-top: 16px; }

  .result { text-align: center; padding: 28px 16px; }
  .result .level { font-size: 56px; font-weight: 800; color: var(--brand); margin: 6px 0; }
  .result .pts { color: var(--muted); }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 24px 16px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Test de nivel</h1>
  <p id="source"></p>
</header>

<main>
  <!-- 1. Gate: instructions + identity + access code -->
  <section id="gate" class="card">
    <h2>Antes de empezar</h2>
    <ul class="notes" id="notes"></ul>
    <label class="field">Nombre y apellido(s)
      <input id="name" type="text" autocomplete="name" autocapitalize="words">
    </label>
    <label class="field">Clase
      <input id="klass" type="text" autocomplete="off">
    </label>
    <label class="field">Código de acceso
      <input id="code" type="text" autocomplete="off" autocapitalize="none">
    </label>
    <button id="startBtn" type="button">Empezar el test</button>
    <p class="err" id="gateErr"></p>
  </section>

  <!-- 2. One question at a time -->
  <section id="quiz" class="card hidden">
    <div class="progress">
      <div class="bar"><div id="barFill"></div></div>
      <span class="txt" id="progressTxt"></span>
    </div>
    <div><span class="qnum" id="qnum"></span></div>
    <div class="prompt" id="prompt"></div>
    <div class="opts" id="opts"></div>
    <div class="actions">
      <button id="nextBtn" type="button" disabled>Siguiente</button>
      <button id="skipBtn" type="button" class="ghost">No lo sé, saltar</button>
    </div>
    <p class="err" id="quizErr"></p>
  </section>

  <!-- 3. Result -->
  <section id="done" class="card result hidden">
    <p>¡Gracias, <span id="doneName"></span>!</p>
    <p>Tu nivel aproximado es</p>
    <div class="level" id="doneLevel"></div>
    <p class="pts" id="donePts"></p>
    <p class="pts">Tu profe recibirá el resultado. Ya puedes cerrar esta página.</p>
  </section>
</main>

<footer id="copyright"></footer>

<script>
const $ = id => document.getElementById(id);
const TOKEN_KEY = "placement.attemptToken";
let state = { token: null, name: "", question: null, choice: null, total: 120 };

async function api(path, body) {
  const opts = body
    ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
    : {};
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok && !data.resync) throw Object.assign(new Error(data.error || "Error de red"), { status: res.status });
  return data;
}

function show(id) {
  ["gate", "quiz", "done"].forEach(s => $(s).classList.toggle("hidden", s !== id));
  window.scrollTo(0, 0);
}

function render(data) {
  if (data.name) state.name = data.name;
  if (data.done) {
    localStorage.removeItem(TOKEN_KEY);
    $("doneName").textContent = state.name;
    $("doneLevel").textContent = data.level === "-" ? "Pre-A1" : data.level;
    $("donePts").textContent = data.points + " / " + data.total + " puntos";
    show("done");
    return;
  }
  state.total = data.total;
  state.question = data.question;
  state.choice = null;
  const q = data.question;
  $("qnum").textContent = q.n;
  $("prompt").textContent = q.prompt;
  const pct = Math.round((data.answered / data.total) * 100);
  $("barFill").style.width = pct + "%";
  $("progressTxt").textContent = "Pregunta " + q.n + " de " + data.total;
  const opts = $("opts");
  opts.innerHTML = "";
  Object.entries(q.options).forEach(([k, v]) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "opt"; b.dataset.k = k;
    const key = document.createElement("span"); key.className = "key"; key.textContent = k.toUpperCase();
    const txt = document.createElement("span"); txt.textContent = v;
    b.append(key, txt);
    b.addEventListener("click", () => {
      state.choice = k;
      opts.querySelectorAll(".opt").forEach(o => o.classList.toggle("chosen", o.dataset.k === k));
      $("nextBtn").disabled = false;
    });
    opts.appendChild(b);
  });
  $("nextBtn").disabled = true;
  $("quizErr").textContent = "";
  show("quiz");
}

async function submitAnswer(choice) {
  const btns = [$("nextBtn"), $("skipBtn")];
  btns.forEach(b => b.disabled = true);
  $("quizErr").textContent = "";
  try {
    const data = await api("/api/answer", { token: state.token, n: state.question.n, choice });
    render(data);
  } catch (err) {
    if (err.status === 401) { localStorage.removeItem(TOKEN_KEY); show("gate"); return; }
    $("quizErr").textContent = "No se pudo guardar. Revisa tu conexión e inténtalo otra vez.";
    $("nextBtn").disabled = state.choice == null;
    $("skipBtn").disabled = false;
  }
}

$("nextBtn").addEventListener("click", () => { if (state.choice != null) submitAnswer(state.choice); });
$("skipBtn").addEventListener("click", () => submitAnswer(null));

$("startBtn").addEventListener("click", async () => {
  const name = $("name").value.trim(), klass = $("klass").value.trim(), code = $("code").value.trim();
  $("gateErr").textContent = "";
  if (!name || !klass || !code) { $("gateErr").textContent = "Rellena los tres campos."; return; }
  $("startBtn").disabled = true;
  try {
    const data = await api("/api/start", { name, klass, code });
    state.token = data.token;
    localStorage.setItem(TOKEN_KEY, data.token);
    render(data);
  } catch (err) {
    $("gateErr").textContent = err.message;
  } finally {
    $("startBtn").disabled = false;
  }
});

// Boot: load instructions, then resume an in-progress attempt if there is one.
(async () => {
  try {
    const info = await api("/api/notes");
    $("title").textContent = info.title;
    $("source").textContent = info.source;
    $("notes").innerHTML = "";
    info.notes.forEach(n => { const li = document.createElement("li"); li.textContent = n; $("notes").appendChild(li); });
    $("copyright").textContent = "© " + info.source + " · uso didáctico no comercial";
  } catch (_) {}

  const saved = localStorage.getItem(TOKEN_KEY);
  if (saved) {
    try {
      const data = await api("/api/next?token=" + encodeURIComponent(saved));
      state.token = saved;
      render(data);
      return;
    } catch (_) { localStorage.removeItem(TOKEN_KEY); }
  }
  show("gate");
})();
</script>
</body>
</html>
